<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0933" />
      <stop offset="60%" stop-color="#0E051D" />
      <stop offset="100%" stop-color="#0A0B14" />
    </radialGradient>

    <!-- Ambient Center Luminescence -->
    <radialGradient id="center-ambient" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B00EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B00EE" stop-opacity="0" />
    </radialGradient>

    <!-- Top Capsule Gradient (Amethyst Violet) -->
    <linearGradient id="capsule-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Bottom Capsule Gradient (Electric Fuchsia Magenta) -->
    <linearGradient id="capsule-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#701A75" />
    </linearGradient>

    <!-- Specular Glass Rim Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Disc -->
  <circle cx="256" cy="256" r="252" fill="url(#bg-glow)" stroke="#8B00EE" stroke-width="3" stroke-opacity="0.35" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#center-ambient)" />

  <!-- The 4 Frosted Glass Capsules forming the X -->
  <g filter="url(#neon-glow)">
    <!-- Top-Left Capsule -->
    <rect x="206" y="70" width="100" height="175" rx="50" transform="rotate(-45 256 256) translate(-50 -20)" fill="url(#capsule-top)" stroke="rgba(255,255,255,0.4)" stroke-width="3" />

    <!-- Top-Right Capsule -->
    <rect x="206" y="70" width="100" height="175" rx="50" transform="rotate(45 256 256) translate(50 -20)" fill="url(#capsule-top)" stroke="rgba(255,255,255,0.4)" stroke-width="3" />

    <!-- Bottom-Left Capsule -->
    <rect x="206" y="267" width="100" height="175" rx="50" transform="rotate(45 256 256) translate(-50 20)" fill="url(#capsule-bottom)" stroke="rgba(255,255,255,0.4)" stroke-width="3" />

    <!-- Bottom-Right Capsule -->
    <rect x="206" y="267" width="100" height="175" rx="50" transform="rotate(-45 256 256) translate(50 20)" fill="url(#capsule-bottom)" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
  </g>
</svg>
